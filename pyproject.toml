[project]
name = "lapis"
version = "0.1.0"
description = "Nightingale-plus: scan existing writable/relay surfaces (web + blockchain/permaweb) for AI-agent coordination fingerprints."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",     # network collectors
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]  # stage-2 Claude confirm; without it, heuristics-only
dev = ["pytest>=8.0"]

[project.scripts]
lapis = "lapis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lapis*"]
